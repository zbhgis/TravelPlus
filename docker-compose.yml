# =============================================================================
# 【全局依赖编排的实现】TravelPlus 一键启动全部依赖：MySQL + Kafka + ES + Redis 集群
# -----------------------------------------------------------------------------
# 设计要点（相对旧的"手动 docker run / 分目录 compose"方式的演进）：
#   1. 本文件位于仓库根目录，作为项目唯一的全局依赖编排入口；
#      8 个服务全部合入一份 compose，`docker compose -f docker-compose.yml up -d`
#      即可一键拉起全部依赖（MySQL / Kafka / ES / Redis 主从+3哨兵）。
#   2. 数据安全：全部持久化卷均以 `external: true` 引用既有卷，compose 只挂载、
#      绝不重建/删除，保证从旧手动容器迁移后【数据不丢】：
#        - MySQL 数据卷    27dbce2a85f4d4acdc16224911564c4e1132e2c8be30d66460619c636f60b0f9
#          （旧容器 travelplus-mysql 的匿名卷，含景点 26 条等全部业务数据）
#        - Kafka 数据卷    b53f114fed2678283d05e841fde88da4542f49ee32830db7b0a4633788d387ae
#        - Redis 主/从数据卷 travelplus-redis-sentinel_master-data / _slave-data
#          （原 docker/redis-sentinel/docker-compose.yml 的具名卷，保留登录态/秒杀库存等）
#   3. ES 不挂卷：其索引数据由后端启动时 SearchDataInitializer 从 MySQL 全量重建
#      （attraction_es/note_es/user_es 均为派生数据，无需持久化）。
#   4. 网络统一为 travelplus-net（172.41.0.0/16），避开 Docker 默认地址池(172.17~172.31)
#      与 WSL2 网段(172.30.0.0/16)以及旧 redis-sentinel 网络(172.40.0.0/16)，
#      防止子网重叠导致哨兵到宿主网关 IP 的 hairpin 路由异常。
#   5. Redis 拓扑与配置完全继承原 docker/redis-sentinel/docker-compose.yml（该独立编排已移除，
#      统一由本全局编排管理；哨兵配置文件 sentinel*.conf 仍保留于原目录并被下方 volumes 复用）：
#      redis-master(6380)+redis-slave(6381)+哨兵×3(26379/80/81)，
#      密码统一 123456，哨兵通过宿主可达 IP 172.30.144.1 探测主节点（WSL2 网关，机器不同需改）。
#   6. 端口与后端 application.yaml 一一对应：MySQL 3307、Redis 哨兵 26379/80/81、
#      Kafka 9092、ES 9400，均无需修改后端配置即可直连。
# -----------------------------------------------------------------------------
# 常用命令：
#   启动全部依赖：  docker compose -f docker-compose.yml up -d
#   停止全部依赖：  docker compose -f docker-compose.yml stop
#   停止并移除容器：docker compose -f docker-compose.yml down
#   （external 卷不会因 down 被删除，数据永久保留）
# =============================================================================

name: travelplus

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 —— 主业务库（库名 travelplus，端口 3307，root/123456）
  # 数据卷复用旧容器匿名卷，迁移/重建后景点等数据不丢。
  # ---------------------------------------------------------------------------
  travelplus-mysql:
    image: mysql:8.0
    container_name: travelplus-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"   # demo 密码（开源演示项目既定凭据，生产请改）
      MYSQL_DATABASE: travelplus      # 仅对空数据卷生效；复用既有卷时以卷内库为准
    volumes:
      - mysql-data:/var/lib/mysql     # 复用既有数据卷，保证 26 景点等数据不丢
    networks:
      - travelplus-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Kafka 3.7.0 —— 秒杀链路消息队列（端口 9092，topic: seckill-ticket-order）
  # 复用旧容器匿名数据卷 /var/lib/kafka/data；其余默认卷(secrets/config)可重建。
  # ---------------------------------------------------------------------------
  travelplus-kafka:
    image: apache/kafka:3.7.0
    container_name: travelplus-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data   # 复用既有 Kafka 数据卷
    networks:
      - travelplus-net
    healthcheck:
      # kafka-broker-api-versions 连接成功即退出码 0，失败非 0，适合做健康探测
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Elasticsearch 8.17.4 —— 全文搜索（端口 9400，无认证，single-node）
  # 不挂卷：索引为派生数据，后端启动时 SearchDataInitializer 自动从 MySQL 全量重建。
  # ---------------------------------------------------------------------------
  travelplus-es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    container_name: travelplus-es
    restart: unless-stopped
    ports:
      - "9400:9200"
    environment:
      discovery.type: single-node      # 单节点模式（demo 不需要多节点集群）
      xpack.security.enabled: "false"  # 关闭安全认证（与 application.yaml 无认证配置一致）
      ES_JAVA_OPTS: "-Xms512m -Xmx512m" # 限制堆内存，避免 WSL2 内存被占满
    networks:
      - travelplus-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis 主节点（端口 6380，密码 123456，AOF 持久化）—— 全部读写入口
  # 数据卷复用 travelplus-redis-sentinel_master-data（保留登录态/秒杀库存/布隆过滤器等）
  # 说明：当前环境发生过一次手动演练故障转移（运行时 6381 曾为 master），本编排按
  # 设计拓扑恢复为 6380 主、6381 从；主从各自 AOF 数据量一致，切换无数据损失。
  # ---------------------------------------------------------------------------
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    hostname: redis-master
    restart: unless-stopped
    ports:
      - "6380:6380"
    command: >
      sh -c "sleep 3;
      redis-server --port 6380
      --requirepass 123456
      --masterauth 123456
      --appendonly yes
      --replica-announce-ip 172.30.144.1
      --replica-announce-port 6380"
    # --requirepass：对外读写认证密码（与项目统一 123456）
    # --masterauth：主节点被降级为从节点后，向新主复制时使用的认证密码（演练恢复场景必需）
    # --appendonly yes：AOF 持久化，重启后数据不丢
    # --replica-announce-ip/port：该节点降级为从时，向新主上报的"外部可达"地址（宿主可直连）
    volumes:
      - master-data:/data
    networks:
      travelplus-net:
        ipv4_address: 172.41.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "123456", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Redis 从节点（端口 6381，密码 123456，AOF 持久化）—— 实时复制主节点
  # 数据卷复用 travelplus-redis-sentinel_slave-data；故障转移后由哨兵提升为新主。
  # ---------------------------------------------------------------------------
  redis-slave:
    image: redis:7.2-alpine
    container_name: redis-slave
    hostname: redis-slave
    restart: unless-stopped
    depends_on:
      - redis-master
    ports:
      - "6381:6381"
    command: >
      sh -c "sleep 5;
      redis-server --port 6381
      --replicaof redis-master 6380
      --masterauth 123456
      --requirepass 123456
      --appendonly yes
      --replica-announce-ip 172.30.144.1
      --replica-announce-port 6381"
    # --replicaof redis-master 6380：容器内网直连主节点复制（内网同步，不走宿主 hairpin）
    # --masterauth：向主节点复制/认证用的密码
    # --replica-announce-ip/port：向主节点上报"外部可达"地址，哨兵据此在故障转移后
    #   把新 master 公布为 172.30.144.1:6381（Windows 宿主可直连，应用无需改配置）
    volumes:
      - slave-data:/data
    networks:
      travelplus-net:
        ipv4_address: 172.41.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "123456", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 哨兵1：端口 26379（quorum=2 参与故障转移投票；配置文件为运行时重写文件）
  # ---------------------------------------------------------------------------
  sentinel1:
    image: redis:7.2-alpine
    container_name: redis-sentinel1
    hostname: redis-sentinel1
    restart: unless-stopped
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26379:26379"
    command: sh -c "sleep 8; redis-sentinel /etc/redis/sentinel.conf --port 26379"
    volumes:
      - ./travelplus-backend/docker/redis-sentinel/sentinel1.conf:/etc/redis/sentinel.conf
    networks:
      travelplus-net:
        ipv4_address: 172.41.0.20
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 哨兵2：端口 26380
  # ---------------------------------------------------------------------------
  sentinel2:
    image: redis:7.2-alpine
    container_name: redis-sentinel2
    hostname: redis-sentinel2
    restart: unless-stopped
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26380:26380"
    command: sh -c "sleep 8; redis-sentinel /etc/redis/sentinel.conf --port 26380"
    volumes:
      - ./travelplus-backend/docker/redis-sentinel/sentinel2.conf:/etc/redis/sentinel.conf
    networks:
      travelplus-net:
        ipv4_address: 172.41.0.21
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26380", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 哨兵3：端口 26381
  # ---------------------------------------------------------------------------
  sentinel3:
    image: redis:7.2-alpine
    container_name: redis-sentinel3
    hostname: redis-sentinel3
    restart: unless-stopped
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26381:26381"
    command: sh -c "sleep 8; redis-sentinel /etc/redis/sentinel.conf --port 26381"
    volumes:
      - ./travelplus-backend/docker/redis-sentinel/sentinel3.conf:/etc/redis/sentinel.conf
    networks:
      travelplus-net:
        ipv4_address: 172.41.0.22
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26381", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

# -----------------------------------------------------------------------------
# 卷定义：全部 external 复用既有卷 —— compose 只挂载、绝不重建/删除（down 也不删），
# 这是"一键重建依赖且数据不丢"的核心保障。
# -----------------------------------------------------------------------------
volumes:
  mysql-data:
    external: true
    name: 27dbce2a85f4d4acdc16224911564c4e1132e2c8be30d66460619c636f60b0f9
  kafka-data:
    external: true
    name: b53f114fed2678283d05e841fde88da4542f49ee32830db7b0a4633788d387ae
  master-data:
    external: true
    name: travelplus-redis-sentinel_master-data
  slave-data:
    external: true
    name: travelplus-redis-sentinel_slave-data

networks:
  travelplus-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.41.0.0/16
          gateway: 172.41.0.1
