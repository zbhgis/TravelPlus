# 【Redis集群的实现】Redis 主从 + 3 哨兵 高可用集群（故障自动切换，非 Cluster 分片）
# ---------------------------------------------------------------------------
# 设计要点：
# 1. 拓扑：redis-master(6380) + redis-slave(6381) + sentinel×3(26379/26380/26381)。
#    quorum=2：sentinel1/2/3 中至少 2 个认为 master 主观下线(sdown) 才触发客观下线(odown) 并故障转移。
# 2. 密码：master/slave 统一 requirepass=123456（与项目 MySQL/Kafka 密码一致）；
#    sentinel 通过 `sentinel auth-pass mymaster 123456` 认证后再探测 master 健康。
# 3. 网络拓扑说明（Docker Desktop WSL2 后端）：
#    - Windows 宿主无法解析容器内部主机名（redis-master），且无管理员权限写 hosts 文件；
#    - 因此哨兵用宿主可达地址 172.30.144.1（WSL2 vEthernet 网关 IP，双向可达）来 monitor master，
#      客户端(Spring/Redisson)从哨兵拿到的 master 地址即是 172.30.144.1:<port>，可直连；
#    - slave 通过 replica-announce-ip 172.30.144.1 上报对外地址，故障转移后哨兵把新 master
#      公布为 172.30.144.1:6381，客户端无需改配置即可重连新主。
#    - 172.30.144.1 若在别的机器上不同，请替换为 `ipconfig` 中 WSL 适配器的 IPv4 地址。
# 4. 本 compose 网络显式指定 172.40.0.0/16，避开 Docker 默认地址池(172.17~172.31)与 WSL2 的 172.30.0.0/16，
#    防止子网重叠导致哨兵到宿主 172.30.144.1 的 hairpin 路由异常。
# 5. 启动：docker compose -f docker/redis-sentinel/docker-compose.yml up -d
#    验证：docker exec redis-sentinel1 redis-cli -p 26379 sentinel master mymaster
#    停止：docker compose -f docker/redis-sentinel/docker-compose.yml down
# ---------------------------------------------------------------------------

name: travelplus-redis-sentinel

services:
  # ---------- 主节点：端口 6380，负责全部读写（秒杀 Lua/Redisson 锁都强依赖主节点） ----------
  redis-master:
    image: redis:7.2-alpine
    container_name: redis-master
    hostname: redis-master
    ports:
      - "6380:6380"
    command: >
      sh -c "sleep 3;
      redis-server --port 6380
      --requirepass 123456
      --masterauth 123456
      --appendonly yes
      --replica-announce-ip 172.30.144.1
      --replica-announce-port 6380"
    # --requirepass：对外读写认证密码（与项目统一 123456）
    # --masterauth：主节点被降级为从节点后，向新主复制时使用的认证密码（演练恢复场景必需）
    # --appendonly yes：AOF 持久化，重启后数据不丢
    # --replica-announce-ip/port：该节点降级为从时，向新主上报的"外部可达"地址（宿主可直连）
    volumes:
      - master-data:/data
    networks:
      redis-sentinel-net:
        ipv4_address: 172.40.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "123456", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------- 从节点：端口 6381，实时同步主节点数据，主节点宕机后被哨兵提升为新主 ----------
  redis-slave:
    image: redis:7.2-alpine
    container_name: redis-slave
    hostname: redis-slave
    depends_on:
      - redis-master
    ports:
      - "6381:6381"
    command: >
      sh -c "sleep 5;
      redis-server --port 6381
      --replicaof redis-master 6380
      --masterauth 123456
      --requirepass 123456
      --appendonly yes
      --replica-announce-ip 172.30.144.1
      --replica-announce-port 6381"
    # --replicaof redis-master 6380：容器内网直连主节点复制（内网同步，不走宿主 hairpin）
    # --masterauth：向主节点复制/认证用的密码
    # --replica-announce-ip/port：向主节点上报"外部可达"地址，哨兵据此在故障转移后
    #   把新 master 公布为 172.30.144.1:6381（Windows 宿主可直连，应用无需改配置）
    volumes:
      - slave-data:/data
    networks:
      redis-sentinel-net:
        ipv4_address: 172.40.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "-a", "123456", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------- 哨兵1：端口 26379（quorum=2 参与故障转移投票） ----------
  sentinel1:
    image: redis:7.2-alpine
    container_name: redis-sentinel1
    hostname: redis-sentinel1
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26379:26379"
    command: sh -c "sleep 8; redis-sentinel /etc/redis/sentinel.conf --port 26379"
    volumes:
      - ./sentinel1.conf:/etc/redis/sentinel.conf
    networks:
      redis-sentinel-net:
        ipv4_address: 172.40.0.20
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------- 哨兵2：端口 26380 ----------
  sentinel2:
    image: redis:7.2-alpine
    container_name: redis-sentinel2
    hostname: redis-sentinel2
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26380:26380"
    command: sh -c "sleep 8; redis-sentinel /etc/redis/sentinel.conf --port 26380"
    volumes:
      - ./sentinel2.conf:/etc/redis/sentinel.conf
    networks:
      redis-sentinel-net:
        ipv4_address: 172.40.0.21
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26380", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # ---------- 哨兵3：端口 26381 ----------
  sentinel3:
    image: redis:7.2-alpine
    container_name: redis-sentinel3
    hostname: redis-sentinel3
    depends_on:
      - redis-master
      - redis-slave
    ports:
      - "26381:26381"
    command: sh -c "sleep 8; redis-sentinel /etc/redis/sentinel.conf --port 26381"
    volumes:
      - ./sentinel3.conf:/etc/redis/sentinel.conf
    networks:
      redis-sentinel-net:
        ipv4_address: 172.40.0.22
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26381", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  master-data:
  slave-data:

networks:
  redis-sentinel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/16
          gateway: 172.40.0.1
