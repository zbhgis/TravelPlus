server:
  port: 8081
# 【本地开发密钥】真实 API Key 不入库：优先环境变量 DEEPSEEK_API_KEY，
# 本地开发可在 application-local.yaml 覆盖（该文件已加入 .gitignore）
spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: travelplus
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/travelplus?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456 # demo 密码（开源项目既定演示库凭据，生产环境请通过环境变量注入替换）
  data:
    # 【Redis集群的实现】Redis 主从 + 3 哨兵 高可用模式（哨兵集群 master=mymaster，故障自动切换）
    # - 哨兵地址 127.0.0.1:26379/26380/26381（docker-compose 见 docker/redis-sentinel/）：
    #   Spring Data Redis 连接哨兵查询当前 master，主节点宕机后哨兵自动提升从节点为新的 master，
    #   应用无需改配置即可自动重连新主（Lettuce 每 ~100ms 轮询一次哨兵）。
    # - 密码说明：spring.data.redis.password=123456 用于认证哨兵返回的 master/slave 节点
    #   （docker-compose 中 requirepass 统一 123456）；哨兵本身无密码，故【不】配置
    #   spring.data.redis.sentinel.password，避免向哨兵误发 AUTH 被拒。
    # - 读写路由：spring-data-redis 的脚本(seckill.lua)/事务/写操作默认强制走主节点，
    #   秒杀库存扣减与 Redisson 锁不会被主从异步复制延迟影响（读从会读到旧库存导致超卖）。
    redis:
      password: 123456
      sentinel:
        master: mymaster
        nodes: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381
      lettuce:
        # 【Redis集群failover加固的实现】shutdown-timeout：Lettuce 优雅关闭时等待在途请求的最大时长。
        # 故障转移瞬间哨兵通告抖动导致连接重建时，若应用恰好被关闭/重启，200ms 后即强制释放连接池，
        # 避免在 failover 风暴期间长时间阻塞关闭流程拖慢/拖死 JVM（配合哨兵 IP 通告修复兜底）。
        shutdown-timeout: 200ms
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  # 【Elasticsearch搜索的实现】ES 连接配置：本地 docker 容器 travelplus-es（8.17.4，http://localhost:9400，无认证）。
  # uris 写错/ES 挂掉时 spring-data 客户端只在真正发起请求时抛异常（懒连接），/search 会在 SearchServiceImpl
  # catch 后降级回 LIKE 查询，保证系统可用；连接/读取超时设短，让"ES 不可用"尽快暴露并快速降级。
  elasticsearch:
    uris: http://localhost:9400
    # 无认证：username/password 留空即可（ES 以 xpack.security.enabled=false 启动）
    connection-timeout: 2s
    socket-timeout: 5s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: your-group-id
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: '*'

mybatis-plus:
  type-aliases-package: com.travelplus.entity # 别名扫描包


logging:
  level:
    com.travelplus: debug
  pattern:
    dateformat: mm:ss.SSS

# 【秒杀门票信息多级缓存改造】本地缓存的配置项(刷新时间、过期时间)、Redis缓存的过期时间
travelplus:
  cache:
    ticket-list:
      mode: caffeine
      refresh-after-write: 5s
      expire-after-write: 10m
      redis-ttl: 30m
  # 【AI客服的实现】DeepSeek 大模型接入配置（绑定 AiProperties，前缀 travelplus.ai）
  # api-key 不入库：优先环境变量 DEEPSEEK_API_KEY；本地开发在 application-local.yaml
  # （已 gitignore）覆盖；两者都未配置时留空，AI 功能走兜底逻辑。
  # base-url 走 OpenAI 兼容端点（DeepSeek 同时兼容 /chat/completions），model 非敏感，保留明文。
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-v4-flash
    # 【Agent架构升级的实现】Agent 运行时治理配置（全部字段有代码默认值，此处显式声明便于调参）：
    # - 预算护栏：maxRounds 工具轮数上限 / maxToolCalls 单次对话工具总次数 / runTimeoutSeconds 墙钟死线
    # - 治理能力：rate-limit-per-minute 用户/IP 限流、breaker-* 熔断参数、memory-* 会话记忆（Redis）
    # - 重试：llm-retry-times 失败硬性重试上限（流式正文已外发则不重试，防重复输出）
    agent:
      max-rounds: 5
      max-tool-calls: 8
      run-timeout-seconds: 100
      temperature: 0.7
      rate-limit-per-minute: 20
      rate-limit-window-seconds: 60
      memory-ttl-hours: 24
      memory-max-messages: 20
      breaker-failure-threshold: 3
      breaker-open-seconds: 30
      llm-retry-times: 1
      llm-retry-backoff-ms: 500
  # 【Elasticsearch搜索的实现】ES 功能开关：false 时 /search 直接走 LIKE 降级实现（不创建索引、不查询 ES），
  # 便于在 ES 故障/未部署的环境一键切回旧逻辑。
  es:
    enabled: true
  # 【企业级客服Agent的实现】客服域配置：
  # - admin-user-ids：客服工作台管理员白名单（演示环境 1 号用户，生产替换为 RBAC）
  # - rate-limit-per-minute：客服咨询独立限流（与旅游助手互不挤占）
  # - handoff-ttl-hours：人工会话状态在 Redis 的保留时长
  support:
    admin-user-ids: 1
    rate-limit-per-minute: 30
    handoff-ttl-hours: 72
    feedback-enabled: true
    max-message-length: 2000
    # 【客服Agent完善】外部知识库路径（可选）：配置后优先读取该 Markdown，
    # 运营编辑后在工作台点「重载知识库」即可热更新，无需重启；留空回退 classpath。
    knowledge-path: ${SUPPORT_KB_PATH:}
