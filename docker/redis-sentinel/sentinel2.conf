# Redis Sentinel 2 - port 26380 (managed by redis-sentinel; file is rewritten at runtime)
port 26380
dir /tmp
protected-mode no
# 【Redis集群failover加固的实现】以下两项默认即为 no，显式声明防止误开启主机名通告：
# - resolve-hostnames no：哨兵不解析主/从节点的主机名（如容器名 redis-master），始终按 IP 处理。
#   防止故障转移期间哨兵把 redis-master 这类容器内网名通告给客户端（Windows 宿主 JVM 无法解析该 DNS 名）。
# - announce-hostnames no：只向客户端通告 IP 地址，绝不通告主机名，从通告侧彻底消灭 UnknownHostException 缝隙。
sentinel resolve-hostnames no
sentinel announce-hostnames no
sentinel announce-ip 172.30.144.1
sentinel announce-port 26380
# monitor 用宿主可达 IP 172.30.144.1（非容器名 redis-master），保证哨兵探测与通告全程走 IP。
# 说明：Redis 无 `sentinel-announce-ip` 指令，哨兵自身对外地址即由上面 announce-ip 承担，已满足显式声明需求。
sentinel monitor mymaster 172.30.144.1 6380 2
sentinel auth-pass mymaster 123456
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
