<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>TravelPlus</title>
<link rel="stylesheet" href="css/app.css?v=drawer12"/>
</head>
<body>
<!-- 【全局搜索的实现】全局搜索入口置顶条——tab 页（首页/旅行/消息/我的）显示，点击跳 #/search -->
<div id="global-search" class="global-search-bar hidden">
  <div class="global-search-inner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <span>搜索景点、游记、用户...</span>
  </div>
</div>
<div id="app" class="app-container"></div>
<div id="tabbar" class="tabbar"></div>
<div id="toast" class="toast"></div>
<script type="module" src="js/main.js?v=exp12"></script>
<!-- 【地图路线规划的实现】高德 JS API 2.0——底图 + 路径规划插件（AMap.Driving/AMap.Walking）
     安全配置必须在加载脚本前声明；key/密钥为 JS API 类型（控制台 Web端(JS API) 平台） -->
<script>
  window._AMapSecurityConfig = { securityJsCode: 'd0bc17bddc23f8fe5d6c08a29d39e2e4' };
</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=e734d90baf148f405672b79a0ee52e36&plugin=AMap.Driving,AMap.Walking,AMap.Transfer,AMap.Geolocation"></script>
<!-- 【秒杀券的实现】JsBarcode CDN——条形码渲染依赖；若加载失败页面内 CSS 条纹降级显示 -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</body>
</html>
